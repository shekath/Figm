# Fly.io: fly launch --copy-config --no-deploy && fly volumes create figmy_data --size 1 && fly secrets set FIGMY_TOKEN=... && fly deploy
app = "figmy"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  FIGMY_DATA = "/data"

[mounts]
  source = "figmy_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # keep running: live collaboration + MCP need a long-lived process
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
