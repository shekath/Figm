name: Deploy to Cloudflare Pages

# Publishes the built web app to Cloudflare Pages. Add your domain to the Pages project once
# (Pages → figmy → Custom domains) and every deploy goes live there.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
# Optional repository variables:
#   CLOUDFLARE_PAGES_PROJECT  Pages project name (default: figmy)
#   GOOGLE_CLIENT_ID          OAuth web client ID for "Sign in with Google"
#   FIGMY_SERVER_URL          your Figmy server (e.g. https://app.example.com) for collaboration + AI

on:
  push:
    branches: [main, 'claude/intelligent-ramanujan-osj4vb']
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'figmy' }}
    steps:
      - name: Check Cloudflare credentials
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deploy skipped: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable it."
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.cfg.outputs.skip != 'true'
        run: npm ci
      - name: Build web app
        if: steps.cfg.outputs.skip != 'true'
        run: npx tsc --noEmit && npx vite build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_FIGMY_SERVER_URL: ${{ vars.FIGMY_SERVER_URL }}
      - name: Create Pages project (first run only)
        if: steps.cfg.outputs.skip != 'true'
        run: npx --yes wrangler@3.114.17 pages project create "$PROJECT" --production-branch=main || echo "Project already exists"
      - name: Deploy to Cloudflare Pages (production)
        if: steps.cfg.outputs.skip != 'true'
        # every deploy from these branches is production, so the custom domain always serves the latest build
        run: npx --yes wrangler@3.114.17 pages deploy dist --project-name="$PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=true
