name: Deploy server to Cloudflare Containers

# Runs the full Figmy server (collaboration, AI/MCP connector, Google sign-in) on Cloudflare,
# with files backed up to R2. Opt-in: set the repository variable FIGMY_CONTAINER=1.
#
# Repository secrets:  CLOUDFLARE_API_TOKEN (Workers + Containers edit), CLOUDFLARE_ACCOUNT_ID,
#                      FIGMY_TOKEN, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
# Repository variables: FIGMY_CONTAINER=1, FIGMY_SERVER_URL (public URL, e.g. https://app.example.com),
#                      GOOGLE_CLIENT_ID, REQUIRE_LOGIN (default 1), ALLOWED_DOMAINS, ALLOWED_EMAILS,
#                      R2_BUCKET (default figmy-data)

on:
  push:
    branches: [main, 'claude/intelligent-ramanujan-osj4vb']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-container
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.FIGMY_CONTAINER == '1'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy Worker + container (Docker image built from ./Dockerfile)
        working-directory: cloudflare
        run: >
          npx wrangler deploy
          --var PUBLIC_URL:"${{ vars.FIGMY_SERVER_URL }}"
          --var FIGMY_S3_ENDPOINT:"https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          --var FIGMY_S3_BUCKET:"${{ vars.R2_BUCKET || 'figmy-data' }}"
          --var FIGMY_GOOGLE_CLIENT_ID:"${{ vars.GOOGLE_CLIENT_ID }}"
          --var FIGMY_REQUIRE_LOGIN:"${{ vars.REQUIRE_LOGIN || '1' }}"
          --var FIGMY_ALLOWED_DOMAINS:"${{ vars.ALLOWED_DOMAINS }}"
          --var FIGMY_ALLOWED_EMAILS:"${{ vars.ALLOWED_EMAILS }}"
      - name: Set secrets
        working-directory: cloudflare
        env:
          FIGMY_TOKEN: ${{ secrets.FIGMY_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          [ -n "$FIGMY_TOKEN" ] && printf '%s' "$FIGMY_TOKEN" | npx wrangler secret put FIGMY_TOKEN
          [ -n "$R2_ACCESS_KEY_ID" ] && printf '%s' "$R2_ACCESS_KEY_ID" | npx wrangler secret put FIGMY_S3_ACCESS_KEY_ID
          [ -n "$R2_SECRET_ACCESS_KEY" ] && printf '%s' "$R2_SECRET_ACCESS_KEY" | npx wrangler secret put FIGMY_S3_SECRET_ACCESS_KEY
          true
