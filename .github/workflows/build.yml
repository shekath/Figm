name: Build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check + build web app and server
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Install Playwright (e2e only, not a project dependency)
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: End-to-end tests (UI, real-time collaboration, MCP over HTTP + stdio)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: figmy-web
          path: |
            dist
            server-dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows installer + portable exe
        run: npm run electron:build -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: figmy-windows
          path: |
            release/*.exe
            release/*.blockmap
